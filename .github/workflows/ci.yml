name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          args: --timeout=3m
      - name: go vet
        run: go vet ./...
      - name: tests
        run: go test -race -count=1 ./...
      - name: self-audit
        run: |
          go build -o lagotto ./cmd/lagotto
          ./lagotto audit --format=text . | tee findings.out
          ! grep -q "^\[" findings.out
