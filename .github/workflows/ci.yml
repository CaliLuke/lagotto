name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.26.x"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          args: --timeout=3m
      - name: go vet
        run: go vet ./...
      - name: tests
        run: go test -race -count=1 ./...
      - name: self-audit
        run: |
          set -o pipefail
          go build -o lagotto ./cmd/lagotto
          ./lagotto audit --format=text --fail-on=low \
            --exclude=gen,vendor,third_party,design/generated,internal/pkgload,internal/version . | tee findings.out
